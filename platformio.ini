; ============================
; 51 单片机学习项目 — 统一构建配置
; ============================
;
; 构建命令：
;   pio run              — 编译所有项目
;   pio run -e 01-led    — 编译 01-LED-Blink
;   pio run -e 02-display — 编译 02-8digit-display
;   pio run -e <env> -t upload — 烧录
;
; 新增项目步骤：
;   1. 在 src/ 下新建子目录，放入源码
;   2. 在此文件末尾追加 [env:xx-name] 继承 [common]

; ── 公共配置（所有环境继承）──
[common]
platform = intel_mcs51
board = STC89C52RC
upload_protocol = stcgal
upload_speed = 9600
monitor_speed = 9600
build_flags =
    --model-small
    --stack-size 16
    -Isrc/include
    -Isrc/common

; ═══════════════════════════════════════════════
; 子项目环境（子项目需在 build_src_filter 里 +<common/*> 引用公共源码）
; ═══════════════════════════════════════════════

[env:00-empty]
extends = common
build_src_filter = +<00-empty/*>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/00-empty

; ═══════════════════════════════════════════════
[env:01-led]
extends = common
build_src_filter = +<01-led/*> +<common/*>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/01-led

; ═══════════════════════════════════════════════
[env:02-display]
extends = common
build_src_filter = +<02-display/*> +<common/*>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/02-display

; ═══════════════════════════════════════════════
[env:03-countdown]
extends = common
build_src_filter = +<03-countdown/*> +<common/*>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/03-countdown

; ═══════════════════════════════════════════════
[env:04-timer]
extends = common
build_src_filter = +<04-timer/*> +<common/*>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/04-timer

; ═══════════════════════════════════════════════
[env:05-dot-matrix]
extends = common
build_src_filter = +<05-dot-matrix/*> +<common/delay.c> +<common/timer.c> +<common/matrix.c>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/05-dot-matrix

; ═══════════════════════════════════════════════
[env:06-uart-pc]
extends = common
build_src_filter = +<06-uart-pc/*> +<common/uart.c>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/06-uart-pc
    -Isrc/common

; ═══════════════════════════════════════════════
[env:07-i2c]
extends = common
build_src_filter = +<07-i2c/*> +<common/delay.c> +<common/i2c.c> +<common/eeprom.c>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/07-i2c
    -Isrc/common

; ═══════════════════════════════════════════════
[env:08-eeprom]
extends = common
build_src_filter = +<08-eeprom/*> +<common/delay.c> +<common/uart.c> +<common/i2c.c> +<common/eeprom.c> +<common/log.c>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -DUART_RX_BUF_SIZE=8
    -Isrc/08-eeprom
    -Isrc/common

; ═══════════════════════════════════════════════
[env:09-oled]
extends = common
build_src_filter = +<09-oled/*> +<common/delay.c> +<common/i2c.c> +<common/oled.c>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/09-oled
    -Isrc/common

; ═══════════════════════════════════════════════
[env:10-18B20-1wire]
extends = common
build_src_filter = +<10-18B20-1wire/*> +<common/delay.c> +<common/i2c.c> +<common/oled.c> +<common/onewire.c> +<common/ds18b20.c>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/10-18B20-1wire
    -Isrc/common

; ═══════════════════════════════════════════════
[env:11-DS1302]
extends = common
build_src_filter = +<11-DS1302/*> +<common/delay.c> +<common/i2c.c> +<common/oled.c> +<common/ds1302.c>
build_flags =
    ${common.build_flags}
    --opt-code-size
    -Isrc/11-DS1302
    -Isrc/common

; ═══════════════════════════════════════════════
[env:12-all-in-one]
extends = common
build_src_filter = +<12-all-in-one/*> +<common/delay.c> +<common/smg.c> +<common/matrix.c> +<common/timer.c> +<common/i2c.c> +<common/oled.c> +<common/ds1302.c>
build_flags =
    ${common.build_flags}
    --opt-code-size
    --stack-auto
    -Isrc/12-all-in-one
    -Isrc/common


